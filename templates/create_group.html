{% extends "base.html" %}
{% block content %}
<section class="card">
  <h2>Create Group</h2>
  <p class="muted">
    Creates a <code>posixGroup</code> with <code>cn</code> and <code>gidNumber</code>.
    {% if test_mode %}
      <strong>TEST MODE:</strong> no LDAP changes will be made.
    {% endif %}
  </p>

  <form method="post" id="main-form">
    <div class="field-row">
      <div class="field">
        <label for="cn">Group name (cn)</label>
        <input type="text" id="cn" name="cn" value="{{ cn or '' }}" placeholder="e.g. class2027" required>
        <small class="muted">Example: <code>staff</code>, <code>class2027</code>, <code>library</code></small>
      </div>

      <div class="field">
        <label for="gid">gidNumber</label>
        <input type="number" id="gid" name="gid" value="{{ gid or '' }}" placeholder="e.g. 2027" min="1" required>
        <small class="muted">Must be unique across groups.</small>
      </div>
    </div>

    <div class="field-row" style="margin-top: 1rem;">
      <button type="submit" name="action" value="create" class="btn">
        Create group
      </button>
    </div>
  </form>
</section>
{% endblock %}
