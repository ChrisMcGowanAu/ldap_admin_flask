name: Python application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show files
        run: ls -la

      - name: Create test config.py
        run: cp config_example.py config.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements.locked.txt ]; then pip install -r requirements.locked.txt; fi

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Lint with flake8
        run: |
          # stop the build for syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

          # treat all other issues as warnings for now
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

